<!DOCTYPE html>

    <title>Video Guide Widget Demo - iframe Approach</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        #page-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Ensure widget appears on top of iframe */
        .video-guide,
        .video-guide__restore-btn {
            position: fixed;
            z-index: 999999;
        }
    </style>

    <!-- Video Guide Widget Styles -->
    <link rel="stylesheet" href="css/base.css">
    <!-- Source map for debugging -->
    <link rel="stylesheet" href="css/base.css.map">
</head>

            'https://karriere.hypoport.de/jobs/wirtschaftsjuristin-it-recht-vertragsmanagement-hybrid-in-leipzig-w-m-d',

        ];

        const iframe = document.getElementById('page-iframe');

        /**
         * setJob()
         * purpose: point the iframe at a given url.
         * input: url (string) — a karriere.hypoport.de job url
         * output: sets iframe.src and iframe.title
         */
        function setJob(url) {
            iframe.src = url;

            // derive a readable title from the url slug for accessibility
            const slug = url.replace('https://karriere.hypoport.de/jobs/', '').replace(/\/$/,'');
            iframe.title = 'Hypoport Karriere - ' + slug.replace(/-/g, ' ');
        }

        /**
         * pickRandomJob()
         * purpose: select a random url from jobUrls.
         * output: calls setJob() with the chosen url
         */
        function pickRandomJob() {
            setJob(jobUrls[Math.floor(Math.random() * jobUrls.length)]);
        }

        // -> initial load: pick a random job on every page reload
        document.addEventListener('DOMContentLoaded', function () {
            pickRandomJob();
        });
    </script>
</body>

</html>
