                title="Hinweis zu KI-generierten Inhalten">
                <!-- official ai-disclosure label, letterforms only. path data is
                     verbatim from the supplied file; everything around it changed:
                     1. the disc path is dropped. the goal is white "AI" sitting
                        directly on the button, and the button already provides a
                        circle — a second one inside it just reads as a badge on a
                        badge.
                     2. the <defs><style> block is gone. an inline <style> inside
                        inline svg is NOT scoped to that svg, it applies to the
                        whole document, and its generic .cls-1 / .cls-2 names
                        would have leaked fills onto any host page element using
                        those classes. this widget is injected into pages we do
                        not control. fill now comes from base.scss.
                     3. viewBox replaced. the original "0 0 566.93 566.93" put the
                        letterforms 20.11 units left of centre — invisible while
                        the disc was there to anchor the eye, obvious without it.
                        the new box is square and centred on the glyph's own
                        bbox: x 166.56..360.14, y 212.73..353.74, centre
                        (263.35, 283.24).
                        the 265 side is padding, and it is what keeps this icon
                        the same apparent size as its neighbours. "AI" is a wide
                        1.37:1 mark while play and pause are taller than wide, so
                        matching heights made it far broader than anything else
                        on the ring. 265 lands its ink area on the mean of the
                        other three: at the current 24px svg box that is 224px^2
                        against play 192, pause 175 and volume 308.
                        the side is a ratio, so this match holds at any svg size —
                        it survived the 28px → 24px change untouched. shrink the
                        side to enlarge the glyph.
                     4. id="Calque_1" and data-name dropped — illustrator cruft,
                        and a fixed id can collide on the host page. -->
